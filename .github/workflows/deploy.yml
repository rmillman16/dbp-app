# Every push to main: run the tests, build the app and publish it to Firebase Hosting (25 Nov).
# If the tests or the build fail, nothing is published and the old version stays live.
# Needs three secrets in GitHub (Settings › Secrets and variables › Actions):
#   FIREBASE_SERVICE_ACCOUNT_DBP_APP_FF144   (made by `firebase init hosting:github`)
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (the same two values as in .env.local)
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DBP_APP_FF144 }}
          projectId: dbp-app-ff144
          channelId: live
